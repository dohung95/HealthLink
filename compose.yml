# Local synthetic-development infrastructure. Re-evaluate the MinIO image and
# support lifecycle before any non-demo or real-patient deployment.
name: ${COMPOSE_PROJECT_NAME:-healthlink}

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_CLINICAL_BUCKET: ${MINIO_CLINICAL_BUCKET:-healthlink-clinical-private}
      MINIO_GUIDELINES_BUCKET: ${MINIO_GUIDELINES_BUCKET:-healthlink-guidelines-private}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set healthlink http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "healthlink/$${MINIO_CLINICAL_BUCKET}"
        mc mb --ignore-existing "healthlink/$${MINIO_GUIDELINES_BUCKET}"
        mc anonymous set none "healthlink/$${MINIO_CLINICAL_BUCKET}"
        mc anonymous set none "healthlink/$${MINIO_GUIDELINES_BUCKET}"
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.18.2
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  minio_data:
    name: ${MINIO_DATA_VOLUME:-healthlink-ai-local-minio-data}
  qdrant_data:
    name: ${QDRANT_DATA_VOLUME:-healthlink-ai-local-qdrant-data}
