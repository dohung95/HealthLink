# ==================================================================
# PROD profile — production-ready, minimal logging
# ==================================================================
spring.jpa.show-sql=false

logging.level.com.HealthLink=WARN
logging.level.org.springframework.security=WARN
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
geoapify.api-key=${GEOAPIFY_API_KEY}
clinical-ai.enabled=false
clinical-ai.cloud-fallback-enabled=false
clinical-ai.patient-visibility=false
