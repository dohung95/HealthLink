# ==================================================================
# DEV profile — compact console for development
# ==================================================================
logging.level.com.HealthLink=DEBUG
logging.level.org.springframework.security=DEBUG
moderation.enabled=false
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
ai.infrastructure.enabled=true
ai.ocr.worker.base-url=${AI_SERVICE_URL:http://127.0.0.1:8097}
ai.service.key=${AI_SERVICE_KEY:}
ai.infrastructure.max-attempts=3
ai.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
ai.storage.access-key=${MINIO_ROOT_USER}
ai.storage.secret-key=${MINIO_ROOT_PASSWORD}
ai.storage.bucket=${MINIO_BUCKET_LABS:healthlink-clinical-private}
ai.lab.temp-directory=${AI_LAB_TEMP_DIRECTORY:${java.io.tmpdir}}
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
