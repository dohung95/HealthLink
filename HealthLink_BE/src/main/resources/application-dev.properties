# ==================================================================
# DEV profile — compact console for development
# ==================================================================
logging.level.com.HealthLink=DEBUG
logging.level.org.springframework.security=DEBUG
moderation.enabled=false
ai.infrastructure.enabled=true
ai.infrastructure.worker-base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai.infrastructure.max-attempts=3
ai.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
ai.storage.access-key=${MINIO_ROOT_USER}
ai.storage.secret-key=${MINIO_ROOT_PASSWORD}
ai.storage.bucket=${MINIO_BUCKET_CLINICAL:clinical-private}
ai.lab.temp-directory=${AI_LAB_TEMP_DIRECTORY:${java.io.tmpdir}}
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
