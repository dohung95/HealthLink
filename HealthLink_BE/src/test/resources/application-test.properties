spring.datasource.url=jdbc:h2:mem:healthlink_test;MODE=MSSQLServer;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.sql.init.mode=never
spring.task.scheduling.enabled=false

# Home Visit config
home-visit.base-latitude=10.80792776715601
home-visit.base-longitude=106.66348621046572
home-visit.max-distance-km=15
home-visit.base-fee=100
home-visit.free-distance-km=3
home-visit.travel-fee-per-km=5
home-visit.average-speed-kmh=25
