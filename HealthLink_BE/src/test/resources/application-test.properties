spring.datasource.url=jdbc:h2:mem:healthlink_test;MODE=MSSQLServer;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.sql.init.mode=never
spring.task.scheduling.enabled=false

# Home Visit config (billing only — doctor-based coordinates, no base coords)
home-visit.base-fee=100
home-visit.free-distance-km=3
home-visit.travel-fee-per-km=5
home-visit.average-speed-kmh=25
home-visit.max-distance-km=10

# Test-only inert MinIO client configuration. No network operation is performed by context creation.
ai.storage.endpoint=http://127.0.0.1:9000
ai.storage.access-key=test-minio-user
ai.storage.secret-key=test-minio-secret
